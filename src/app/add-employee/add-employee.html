<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card shadow-lg border-0 rounded-3">
        
        <!-- Header -->
        <div class="card-header bg-primary text-white text-center">
          <h4 class="mb-0">
            {{ isEdit ? 'Update Employee' : 'Add Employee' }}
          </h4>
        </div>

        <!-- Body -->
        <div class="card-body p-4">

          <form (ngSubmit)="onSubmit()" #empForm="ngForm">

            <div class="row g-3">

              <!-- Name -->
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control"
                       name="empName"
                       [(ngModel)]="employee.empName"
                       required>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control"
                       name="empEmail"
                       [(ngModel)]="employee.empEmail"
                       required>
              </div>

              <!-- Gender -->
              <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select class="form-select"
                        name="empGender"
                        [(ngModel)]="employee.empGender"
                        required>
                  <option value="">Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>

              <!-- City Dropdown -->
              <div class="col-md-6">
                <label class="form-label">City</label>
                <select class="form-select"
                        name="empCity"
                        [(ngModel)]="employee.empCity"
                        required>
                  <option value="">Select City</option>
                  <option>Ahmedabad</option>
                  <option>Surat</option>
                  <option>Rajkot</option>
                  <option>Vadodara</option>
                </select>
              </div>

              <!-- Department Checkbox -->
              <div class="col-md-6">
                <label class="form-label d-block">Department</label>

                <div class="form-check">
                  <input type="checkbox"
                    value="IT"
                    [checked]="isChecked('IT')"
                    (change)="onDepartmentChange($event)">
                  <label class="form-check-label">IT</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input"
                         type="checkbox"
                         value="HR"
                         [checked]="isChecked('HR')"
                         (change)="onDepartmentChange($event)">
                  <label class="form-check-label">HR</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input"
                         type="checkbox"
                         value="Sales"
                         [checked]="isChecked('Sales')"
                         (change)="onDepartmentChange($event)">
                  <label class="form-check-label">Sales</label>
                </div>

              </div>

              <!-- Image Upload -->
              <div class="col-md-6">
                <label class="form-label">Profile Image</label>
                <input type="file"
                       class="form-control"
                       (change)="onFileSelected($event)">
              </div>

              <!-- Image Preview -->
              <div class="col-12 text-center" *ngIf="employee.empImage">
                <img [src]="'http://localhost:8080/uploads/' + employee.empImage"
                     class="img-thumbnail mt-2"
                     width="150">
              </div>

              <!-- About -->
              <div class="col-12">
                <label class="form-label">About Employee</label>
                <textarea class="form-control"
                          rows="4"
                          name="aboutEmployee"
                          [(ngModel)]="employee.aboutEmployee">
                </textarea>
              </div>

            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex justify-content-between">
              
              <button type="submit" class="btn btn-success px-4">
                {{ isEdit ? 'Update Employee' : 'Add Employee' }}
              </button>

              <!-- <button type="button"
                      class="btn btn-secondary px-4"
                      (click)="router.navigate(['/'])">
                Cancel
              </button> -->

            </div>

          </form>

        </div>

      </div>

    </div>
  </div>
</div>
